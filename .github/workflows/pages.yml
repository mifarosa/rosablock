name: Publish site

# Publishes docs/ (privacy policy, support page) with GitHub Pages, the same way Wasorty is
# published. One-time setup: repository Settings -> Pages -> Source: GitHub Actions.
# The site then lives at <your Pages address>/rosablock/ (https://mifarosa.com/rosablock/ when
# the Pages domain of the account is mifarosa.com).
on:
  push:
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
